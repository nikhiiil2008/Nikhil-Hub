function makeQuestions(){if(subjectId==='bio'&&chapterIndex===0)return biologyFlowerMCQs.map((q,i)=>({...q,id:'bio-0-real-'+i}));if(subjectId==='bio'&&chapterIndex===1)return biologyHumanMCQs.map((q,i)=>({...q,id:'bio-1-real-'+i}));if(subjectId==='bio'&&chapterIndex===2)return biologyReproductiveHealthMCQs.map((q,i)=>({...q,id:'bio-2-real-'+i}));let facts=['इस अध्याय की मूल अवधारणा और उसकी परिभाषा','मुख्य सिद्धांत तथा उसके वैज्ञानिक आधार','प्रक्रिया के प्रमुख चरण और उनका क्रम','महत्वपूर्ण उदाहरण तथा उनका उपयोग','इस विषय से संबंधित प्रमुख शब्दावली','कारण और परिणाम के बीच संबंध','अवधारणा का दैनिक जीवन में अनुप्रयोग','परीक्षा में पूछे जाने वाले मुख्य बिंदु'];return Array.from({length:20},(_,i)=>({id:current().id+'-'+chapterIndex+'-'+i,question:chap()+' : '+facts[i%8]+' को समझने के लिए सबसे उपयुक्त तरीका क्या है? (Demo question '+(i+1)+')',options:['परिभाषा, सिद्धांत और उदाहरण को जोड़कर समझना','बिना समझे केवल शब्द याद करना','प्रश्न को छोड़ देना','सभी विकल्पों को समान मानना'],answer:0,explanation:'यह अभ्यास हेतु बनाया गया demo प्रश्न है। सही अध्ययन में अवधारणा, सिद्धांत और उदाहरण का संबंध समझना आवश्यक है।'}))}
function startQuiz(md){if(timer){clearInterval(timer);timer=null}mode=md;page=md==='test'?'tests':'practice';quiz=makeQuestions();qi=0;selected=null;answered=false;score=0;seconds=md==='test'?1800:0;testAnswers={};testMarked=[];testSubmitted=false;if(md==='test')timer=setInterval(()=>{if(!testSubmitted){seconds--;if(seconds<=0){seconds=0;submitTest(true)}else if(page==='tests')render()}},1000);render();window.scrollTo(0,0)}
function quizPage(){if(mode==='test')return testPage();if(!quiz.length)quiz=makeQuestions();if(qi>=quiz.length)return '<div class="panel"><h1>Test complete 🎉</h1><h2>'+score+' / '+quiz.length+'</h2><p>आपका result इस device पर save कर दिया गया है।</p><button class="solid" onclick="go(\'results\')">View results</button></div>';let q=quiz[qi];return '<div class="welcome"><div><h1>'+(mode==='test'?'Mock test':'Practice zone')+'</h1><div class="muted">'+current().name+' • '+chap()+'</div></div><span class="chip">'+(qi+1)+' / '+quiz.length+'</span></div><div class="question"><div class="muted" style="font-size:12px">DEMO QUESTION • '+(mode==='test'?'Exam mode':'Practice mode')+'</div><h3>'+q.question+'</h3>'+q.options.map((o,i)=>'<button class="option '+(answered&&i===q.answer?'correct':answered&&i===selected?'wrong':'')+'" '+(answered?'disabled':'')+' onclick="answer('+i+')">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+(answered?'<div class="feedback"><b>'+(selected===q.answer?'✅ सही जवाब!':'❌ गलत जवाब!')+'</b><p><b>सही उत्तर:</b> '+String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]+'</p><p><b>समझिए:</b> '+q.explanation+'</p></div>':'')+'<div class="btnrow">'+(answered?'<button class="solid" onclick="nextQ()">Next question →</button>':'<button class="outline" onclick="bookmarkQuestion()">🔖 Bookmark</button>')+'</div></div><div class="muted">Practice questions are illustrative demos, not official UP Board questions.</div>'}
function testPage(){if(!quiz.length)return '<div class="panel"><h2>Mock test complete</h2><p>Your result has been saved.</p><button class="solid" onclick="go(\\'results\\')">View results</button></div>';if(testSubmitted){let attempted=Object.keys(testAnswers).length,correct=quiz.reduce((n,q,i)=>n+(testAnswers[i]===q.answer?1:0),0);return '<div class="panel"><h1>Mock test submitted 🎉</h1><h2>'+correct+' / '+quiz.length+'</h2><p class="muted">Attempted: '+attempted+' • Unattempted: '+(quiz.length-attempted)+' • Accuracy: '+Math.round(correct/quiz.length*100)+'%</p><div class="testhelp"><span style="color:#087c4d">🟢 Correct answer</span><span style="color:#bd3449">🔴 Your wrong answer</span></div><button class="solid" onclick="go(\\'results\\')">View results</button> <button class="outline" onclick="go(\\'home\\')">Home</button></div>'+quiz.map((q,i)=>'<div class="question panel"><div class="muted">QUESTION '+(i+1)+' • '+(testAnswers[i]===undefined?'Not attempted':testAnswers[i]===q.answer?'Correct':'Incorrect')+'</div><h3>'+q.question+'</h3>'+q.options.map((o,j)=>'<div class="option '+(j===q.answer?'correct':testAnswers[i]===j?'wrong':'')+'">'+String.fromCharCode(65+j)+'. '+o+(j===q.answer?' ✓':testAnswers[i]===j?' ✕':'')+'</div>').join('')+'<div class="feedback"><b>Explanation</b><p>'+q.explanation+'</p></div></div>').join('')}let q=quiz[qi],v=testAnswers[qi];return '<div class="welcome"><div><h1>Timed Mock Test ⏱️</h1><div class="muted">'+current().name+' • '+chap()+'</div></div><span class="chip">Question '+(qi+1)+' / '+quiz.length+'</span></div><div class="testbar"><div><div class="muted" style="font-size:11px">TIME REMAINING</div><div class="clock">'+String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')+'</div></div><button class="solid" onclick="submitTest(false)">Submit test</button></div><div class="panel"><div class="testhelp"><span class="answered">Answered</span><span>Not answered</span><span class="marked">Review</span></div><div class="palette">'+quiz.map((_,i)=>'<button class="palbtn '+(i===qi?'current ':'')+(testAnswers[i]!==undefined?'done ':'')+(testMarked.includes(i)?'review':'')+'" onclick="jumpTest('+i+')">'+(i+1)+'</button>').join('')+'</div></div><div class="question"><div class="muted" style="font-size:12px">QUESTION '+(qi+1)+'</div><h3>'+q.question+'</h3>'+q.options.map((o,i)=>'<button class="option '+(v===i?'selected':'')+'" onclick="chooseTest('+i+')">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+'<div class="btnrow"><button class="outline" onclick="toggleMark()">⚑ '+(testMarked.includes(qi)?'Unmark review':'Mark for review')+'</button><button class="outline" onclick="clearTestAnswer()">Clear response</button><button class="solid" onclick="jumpTest(Math.min(qi+1,quiz.length-1))">'+(qi===quiz.length-1?'Last question':'Next →')+'</button></div></div><p class="muted">Demo mock test: questions are illustrative, not official board questions.</p>'}
function chooseTest(i){if(testSubmitted)return;testAnswers[qi]=i;render()}
function jumpTest(i){qi=i;render()}
function toggleMark(){testMarked=testMarked.includes(qi)?testMarked.filter(x=>x!==qi):[...testMarked,qi];render()}
function clearTestAnswer(){delete testAnswers[qi];render()}
function submitTest(auto){if(testSubmitted)return;if(!auto&&!confirm('Submit your mock test now?'))return;testSubmitted=true;if(timer){clearInterval(timer);timer=null}let correct=quiz.reduce((n,q,i)=>n+(testAnswers[i]===q.answer?1:0),0);let a=get('scores',[]);a.unshift({date:new Date().toLocaleDateString('en-IN'),score:correct,total:quiz.length,mode:'mock test',attempted:Object.keys(testAnswers).length});put('scores',a.slice(0,50));render()}
function answer(i){if(answered)return;selected=i;answered=true;if(i===quiz[qi].answer)score++;else{let w=get('wrong',[]);w=w.filter(x=>!(x.subject===current().name&&x.chapter===chap()&&x.question===quiz[qi].question));w.unshift({subject:current().name,chapter:chap(),question:quiz[qi].question,selectedAnswer:quiz[qi].options[i],correctAnswer:quiz[qi].options[quiz[qi].answer],explanation:quiz[qi].explanation});put('wrong',w.slice(0,100))}let d=get('done',[]);d.push(quiz[qi].id);put('done',d);render()}
function nextQ(){qi++;selected=null;answered=false;if(qi>=quiz.length){let a=get('scores',[]);a.unshift({date:new Date().toLocaleDateString('en-IN'),score,total:quiz.length,mode});put('scores',a.slice(0,50));quiz=[]}render()}
function bookmarkQuestion(){let s=get('saved',[]);s.unshift({subject:current().name,chapter:chap(),question:quiz[qi].question});put('saved',s);alert('Question bookmarked!')}
function saveChapter(){let s=get('saved',[]);s.unshift({subject:current().name,chapter:chap(),question:'Chapter: '+chap()});put('saved',s);alert('Chapter saved!')}
function pyqPage(){return '<h1>Previous Year Questions 📄</h1><p class="muted">Authentic PYQs will be published only after source/year verification.</p><div class="empty"><div style="font-size:35px">📚</div><h3>Verified PYQ library is being prepared</h3><p>No generated demo question is labelled as a previous-year question.</p></div>'}
function notesPage(){return '<h1>Notes & PDFs 📝</h1><p class="muted">Chapter-wise study material library.</p><div class="empty"><div style="font-size:35px">📖</div><h3>Verified notes are being added</h3><p>Handwritten PDFs and diagrams will appear here after upload and review.</p></div>'}
function itemsPage(k,title,emoji){let a=get(k,[]);if(k==='wrong')return '<h1>'+emoji+' '+title+'</h1><p class="muted">गलत हुए प्रश्न, तुम्हारा जवाब और सही जवाब — सब एक जगह।</p>'+(a.length?'<div class="btnrow"><button class="outline" onclick="clearWrong()">Clear all revision history</button></div><div class="list">'+a.map((x,i)=>'<div class="chapter"><div><b>'+esc(x.subject||'')+' • '+esc(x.chapter||'')+'</b><p>'+esc(x.question||'')+'</p><p style="color:#bd3449"><b>तुम्हारा जवाब:</b> '+esc(x.selectedAnswer||'जानकारी उपलब्ध नहीं')+'</p><p style="color:#087c4d"><b>सही जवाब:</b> '+esc(x.correctAnswer||'पुराने रिकॉर्ड में उपलब्ध नहीं')+'</p><p class="muted"><b>समझिए:</b> '+esc(x.explanation||'')+'</p><button class="outline" onclick="removeWrong('+i+')">Remove after revision</button></div></div>').join('')+'</div>':'<div class="empty">अभी कोई गलत उत्तर सेव नहीं है। Practice में गलत जवाब देने पर वह यहाँ दिखाई देगा।</div>');return '<h1>'+emoji+' '+title+'</h1><p class="muted">Saved on this device</p>'+(a.length?'<div class="list">'+a.map(x=>'<div class="chapter"><div><b>'+esc(x.subject||'')+' • '+esc(x.chapter||'')+'</b><p class="muted">'+esc(x.question||'')+'</p></div></div>').join('')+'</div>':'<div class="empty">अभी कोई item नहीं है। Practice करते समय questions bookmark करें या गलत उत्तरों को यहाँ revise करें।</div>')}
function removeWrong(i){let a=get('wrong',[]);a.splice(i,1);put('wrong',a);render()}
function clearWrong(){if(!confirm('सभी revision questions हटाने हैं?'))return;put('wrong',[]);render()}
function resultsPage(){let a=get('scores',[]);return '<h1>My performance 📊</h1><p class="muted">Your recent practice and mock test scores.</p>'+(a.length?'<div class="list">'+a.map(x=>'<div class="chapter"><div><b>'+x.mode+' • '+x.date+'</b><div class="muted">'+x.score+' / '+x.total+' correct</div></div><b>'+Math.round(x.score/x.total*100)+'%</b></div>').join('')+'</div>':'<div class="empty">अभी कोई test result नहीं है। एक practice session शुरू करें!</div>')}
function profilePage(){return '<h1>My Profile 👤</h1><div class="panel"><div class="avatar">N</div><h2>NG Learner</h2><p class="muted">Your progress is stored locally on this device.</p><label>Display name</label><input class="search" id="pname" value="'+esc(get('name','Student'))+'"><button class="solid" onclick="put(\'name\',document.getElementById(\'pname\').value);alert(\'Profile saved\')">Save profile</button></div><p class="muted">No account or paid API required. Clearing browser data may erase local progress.</p>'}
function searchPage(){let term=searchTerm.toLowerCase();let matches=[];subjects.forEach(s=>s.chapters.forEach((c,i)=>{if((c+' '+s.name).toLowerCase().includes(term))matches.push({s,i,c})}));return '<h1>Search 🔎</h1><input class="search" placeholder="Search subject or chapter..." value="'+esc(searchTerm)+'" oninput="searchTerm=this.value;document.getElementById(\'searchResults\').innerHTML=searchMatches()"><div id="searchResults">'+searchMatches()+'</div>'}
function searchMatches(){let t=searchTerm.toLowerCase();let a=[];subjects.forEach(s=>s.chapters.forEach((c,i)=>{if((c+' '+s.name).toLowerCase().includes(t))a.push({s,i,c})}));return '<div class="list">'+a.map(x=>'<div class="chapter"><b>'+x.s.name+' • '+x.c+'</b><button onclick="subjectId=\''+x.s.id+'\';openChapter('+x.i+')">Open</button></div>').join('')+'</div>'}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();searchTerm='';go('search')}});
render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
