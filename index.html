<!doctype html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6558e8"><meta name="description" content="NG Board Buddy — UP Board aur competitive exams ki smart preparation."><link rel="manifest" href="manifest.webmanifest"><title>NG Board Buddy — Learn. Practice. Win.</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Hind:wght@400;500;600;700&display=swap');
:root{--ink:#20213a;--muted:#777991;--purple:#6558e8;--purple2:#eeeaff;--bg:#f6f7fc;--card:#fff;--line:#ececf4;--green:#159b69;--red:#df5365;--shadow:0 10px 35px #29255a0c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans','Hind',sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(5vw,20px);position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}.logo{width:39px;height:39px;border-radius:13px;background:linear-gradient(135deg,#7566f2,#4c3dc8);color:white;display:grid;place-items:center;font-weight:800;box-shadow:0 6px 15px #6558e844}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:1.5px}.topright{display:flex;align-items:center;gap:12px}.avatar{background:#fff0dc;color:#b76a14;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-weight:800}.layout{max-width:1240px;margin:auto;padding:28px 22px 100px;display:grid;grid-template-columns:225px 1fr;gap:28px}.side{position:sticky;top:96px;height:max-content}.navlabel{font-size:10px;color:#a0a0b2;font-weight:800;letter-spacing:1.5px;margin:12px 12px}.navbtn{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;margin:3px 0;border-radius:13px;background:transparent;color:#666981;text-align:left;font-weight:600}.navbtn:hover,.navbtn.active{background:var(--purple2);color:var(--purple)}.content{min-width:0}.welcome{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.welcome h1{font-size:26px;margin:0 0 5px}.muted{color:var(--muted)}.hero{background:linear-gradient(115deg,#6558e8,#8679f5 68%,#a89fff);color:#fff;border-radius:24px;padding:28px 30px;display:flex;justify-content:space-between;align-items:center;overflow:hidden;box-shadow:0 14px 35px #6558e82b}.hero h2{font-size:25px;max-width:450px;margin:0 0 9px}.hero p{color:#e7e3ff;margin:0 0 18px}.hero .art{font-size:82px;filter:drop-shadow(0 12px 10px #342b8155)}.primary{background:#fff;color:var(--purple);padding:11px 17px;border-radius:11px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stat,.panel,.subject,.chapter,.question{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow)}.stat b{font-size:24px;display:block}.stat span{font-size:12px;color:var(--muted)}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:26px 0 13px}.sectionhead h2{font-size:18px;margin:0}.subjects{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.subject{cursor:pointer;transition:.2s}.subject:hover{transform:translateY(-3px);border-color:#c8c1ff}.subject .emoji{font-size:27px}.subject b{display:block;margin:10px 0 3px}.subject small{color:var(--muted)}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.quick button{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;text-align:left;color:var(--ink);font-weight:700}.quick span{font-size:23px;display:block;margin-bottom:8px}.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:white;outline:none;margin:4px 0 15px}.search:focus{border-color:var(--purple)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{background:#f0efff;color:var(--purple);padding:7px 12px;border-radius:20px;font-size:12px;font-weight:700}.list{display:grid;gap:10px}.chapter{display:flex;align-items:center;justify-content:space-between;gap:10px}.chapter button,.secondary{background:var(--purple2);color:var(--purple);padding:9px 12px;border-radius:10px;font-weight:700}.tag{font-size:10px;color:#ad7a23;background:#fff6df;padding:5px 8px;border-radius:8px}.question{margin:14px 0}.option{display:block;width:100%;text-align:left;padding:13px;margin:9px 0;border:1px solid var(--line);background:white;border-radius:12px;color:var(--ink)}.option.correct{background:#e8f8f0;border-color:#55bd8b;color:#087c4d}.option.wrong{background:#fff0f1;border-color:#e87985;color:#bd3449}.feedback{padding:13px;border-radius:12px;background:#f4f3ff;margin-top:12px}.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.solid{background:var(--purple);color:white;padding:11px 16px;border-radius:11px;font-weight:800}.outline{background:white;border:1px solid var(--line);padding:10px 14px;border-radius:11px;color:var(--ink);font-weight:700}.note{line-height:1.8;background:#fff;border:1px solid var(--line);padding:18px;border-radius:15px;margin:10px 0}.empty{padding:35px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #d7d5e6;border-radius:16px}.bottom{display:none}.footer{text-align:center;color:#9a9aab;font-size:11px;margin-top:30px}.hide{display:none!important}.testbar{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin:12px 0}.clock{font-size:20px;font-weight:800;color:var(--purple);font-variant-numeric:tabular-nums}.palette{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0}.palbtn{padding:10px 4px;border-radius:9px;background:#f0efff;color:var(--purple);font-weight:800}.palbtn.current{outline:2px solid var(--purple)}.palbtn.done{background:#159b69;color:white}.palbtn.review{background:#fff0cf;color:#95600a}.testhelp{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}.testhelp span:before{content:'●';margin-right:5px;color:var(--purple)}.testhelp .answered:before{color:#159b69}.testhelp .marked:before{color:#d89b26}
@media(max-width:850px){.layout{display:block;padding:20px 15px 100px}.side{display:none}.top{height:62px;padding:0 16px}.welcome h1{font-size:22px}.subjects{grid-template-columns:repeat(2,1fr)}.subject:last-child{grid-column:span 2}.hero{padding:22px}.hero h2{font-size:21px}.hero .art{font-size:55px}.stats{gap:8px}.stat{padding:13px}.stat b{font-size:20px}.quick{grid-template-columns:repeat(2,1fr)}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 3px max(8px,env(safe-area-inset-bottom))}.bottom button{background:transparent;color:#777991;font-size:10px;display:grid;gap:3px;justify-items:center}.bottom button.active{color:var(--purple);font-weight:800}.bottom i{font-style:normal;font-size:19px}}@media(min-width:851px){.bottom{display:none}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">NG</div><div>NG Board Buddy<small>LEARN • PRACTICE • WIN</small></div></div><div class="topright"><span class="muted" id="date"></span><div class="avatar">N</div></div></header><div class="layout"><aside class="side"><div class="navlabel">MENU</div><div id="sideNav"></div><div class="navlabel">YOUR SPACE</div><div id="sideExtra"></div></aside><main class="content" id="main"></main></div><nav class="bottom" id="bottomNav"></nav></div>
<script>
const subjects=[{id:'bio',name:'Biology',hi:'जीव विज्ञान',emoji:'🧬',color:'#e8f8ef',chapters:['पुष्पी पादपों में लैंगिक जनन','मानव जनन','जनन स्वास्थ्य','वंशागति तथा विविधता के सिद्धांत','आणविक आधार of inheritance']},{id:'phy',name:'Physics',hi:'भौतिक विज्ञान',emoji:'⚡',color:'#fff2dc',chapters:['वैद्युत आवेश तथा क्षेत्र','स्थिरवैद्युत विभव तथा धारिता','विद्युत धारा','गतिमान आवेश और चुम्बकत्व','विद्युतचुम्बकीय प्रेरण']},{id:'chem',name:'Chemistry',hi:'रसायन विज्ञान',emoji:'🧪',color:'#f1eaff',chapters:['विलयन','वैद्युत रसायन','रासायनिक बलगतिकी','d एवं f ब्लॉक के तत्व','उपसहसंयोजन यौगिक']},{id:'eng',name:'English',hi:'अंग्रेज़ी',emoji:'📚',color:'#e9f2ff',chapters:['The Last Lesson','Lost Spring','Deep Water','The Rattrap','Indigo']},{id:'hin',name:'Hindi',hi:'हिन्दी',emoji:'✍️',color:'#ffeef1',chapters:['भक्तिन','बाजार दर्शन','काले मेघा पानी दे','पहलवान की ढोलक','आत्मपरिचय']}];
const nav=[['home','🏠','Home'],['subjects','📚','Subjects'],['practice','✍️','Practice'],['tests','⏱️','Mock Tests'],['pyq','📄','PYQs'],['notes','📝','Notes'],['saved','🔖','Bookmarks'],['revision','🔁','Revision'],['results','📊','Results'],['profile','👤','Profile']];
let page='home',subjectId='bio',chapterIndex=0,quiz=[],qi=0,selected=null,answered=false,mode='practice',score=0,searchTerm='',timer=null,seconds=0,testAnswers={},testSubmitted=false,testMarked=[];
const get=(k,d=[])=>{try{return JSON.parse(localStorage.getItem('ngbb_'+k))??d}catch{return d}},put=(k,v)=>localStorage.setItem('ngbb_'+k,JSON.stringify(v));
const current=()=>subjects.find(s=>s.id===subjectId),chap=()=>current().chapters[chapterIndex];
function navHTML(){const mk=(arr)=>arr.map(([id,ic,t])=>'<button class="navbtn '+(page===id?'active':'')+'" onclick="go(\''+id+'\')">'+ic+' '+t+'</button>').join('');document.getElementById('sideNav').innerHTML=mk(nav.slice(0,6));document.getElementById('sideExtra').innerHTML=mk(nav.slice(6));document.getElementById('bottomNav').innerHTML=nav.slice(0,5).map(([id,ic,t])=>'<button class="'+(page===id?'active':'')+'" onclick="go(\''+id+'\')"><i>'+ic+'</i>'+t+'</button>').join('')}
function go(p){if(p==='tests'){startQuiz('test');return}page=p;render();window.scrollTo(0,0)}
function stats(){return {done:get('done',[]).length,saved:get('saved',[]).length,wrong:get('wrong',[]).length,score:get('scores',[])}}
function render(){navHTML();const m=document.getElementById('main');if(page==='home')m.innerHTML=home();else if(page==='subjects')m.innerHTML=subjectsPage();else if(page==='chapters')m.innerHTML=chaptersPage();else if(page==='chapter')m.innerHTML=chapterPage();else if(page==='practice'||page==='tests')m.innerHTML=quizPage();else if(page==='pyq')m.innerHTML=pyqPage();else if(page==='notes')m.innerHTML=notesPage();else if(page==='saved')m.innerHTML=itemsPage('saved','Bookmarks','🔖');else if(page==='revision')m.innerHTML=itemsPage('wrong','Wrong answers revision','🔁');else if(page==='results')m.innerHTML=resultsPage();else if(page==='profile')m.innerHTML=profilePage();else if(page==='search')m.innerHTML=searchPage();document.getElementById('date').textContent=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'})}
function home(){let s=stats();return '<div class="welcome"><div><h1>नमस्ते, विद्यार्थी! 👋</h1><div class="muted">आज की तैयारी शुरू करें। आपका लक्ष्य, आपका भविष्य।</div></div></div><section class="hero"><div><h2>हर दिन थोड़ा बेहतर, हर परीक्षा में आगे! 🚀</h2><p>अपनी तैयारी को smart बनाइए — एक chapter at a time.</p><button class="primary" onclick="go(\'subjects\')">Start learning →</button></div><div class="art">🎓</div></section><div class="stats"><div class="stat"><b>'+s.done+'</b><span>Questions attempted</span></div><div class="stat"><b>'+s.saved+'</b><span>Bookmarks</span></div><div class="stat"><b>'+s.wrong+'</b><span>To revise</span></div></div><div class="sectionhead"><h2>अपना विषय चुनें</h2><button class="secondary" onclick="go(\'subjects\')">All subjects</button></div>'+subjectCards()+'<div class="sectionhead"><h2>Quick practice</h2></div><div class="quick"><button onclick="startQuiz(\'practice\')"><span>✍️</span>Daily practice</button><button onclick="go(\'tests\')"><span>⏱️</span>Mock test</button><button onclick="go(\'pyq\')"><span>📄</span>Previous papers</button><button onclick="go(\'revision\')"><span>🔁</span>Revise mistakes</button></div><div class="footer">NG Board Buddy • Demo learning content — verified PYQs will be added with source details.</div>'}
function subjectCards(){return '<div class="subjects">'+subjects.map(s=>'<div class="subject" onclick="openSubject(\''+s.id+'\')" style="background:linear-gradient(145deg,#fff,'+s.color+')"><div class="emoji">'+s.emoji+'</div><b>'+s.name+'</b><small>'+s.chapters.length+' chapters</small></div>').join('')+'</div>'}
function subjectsPage(){return '<div class="welcome"><div><h1>All Subjects 📚</h1><div class="muted">Choose a subject to explore chapters.</div></div></div>'+subjectCards()}
function openSubject(id){subjectId=id;go('chapters')}
function chaptersPage(){return '<div class="welcome"><div><h1>'+current().emoji+' '+current().name+'</h1><div class="muted">'+current().hi+' • Chapter library</div></div><button class="outline" onclick="go(\'subjects\')">← Subjects</button></div><div class="list">'+current().chapters.map((c,i)=>'<div class="chapter"><div><b>'+(i+1)+'. '+c+'</b><div class="muted" style="font-size:12px;margin-top:5px">Notes • Important points • Practice</div></div><button onclick="openChapter('+i+')">Open →</button></div>').join('')+'</div>'}
function openChapter(i){chapterIndex=i;go('chapter')}
function chapterPage(){return '<div class="welcome"><div><h1>'+chap()+'</h1><div class="muted">'+current().name+' • Chapter '+(chapterIndex+1)+'</div></div><button class="outline" onclick="go(\'chapters\')">← Back</button></div><div class="chips"><span class="chip">Chapter notes</span><span class="chip">Important points</span><span class="chip">Demo practice</span></div><div class="panel"><h3>📌 Important study points</h3><p class="muted">इस chapter के verified, board-aligned notes और diagrams content review के बाद जोड़े जाएंगे। अभी यह section content placeholder है — इसे textbook facts न मानें।</p><button class="solid" onclick="startQuiz(\'practice\')">Practice demo questions →</button> <button class="outline" onclick="saveChapter()">🔖 Save chapter</button></div><div class="panel" style="margin-top:12px"><h3>🖼️ Diagrams & handwritten notes</h3><p class="muted">Verified diagrams और PDF notes अभी upload नहीं किए गए हैं।</p></div>'}
function makeQuestions(){let facts=['इस अध्याय की मूल अवधारणा और उसकी परिभाषा','मुख्य सिद्धांत तथा उसके वैज्ञानिक आधार','प्रक्रिया के प्रमुख चरण और उनका क्रम','महत्वपूर्ण उदाहरण तथा उनका उपयोग','इस विषय से संबंधित प्रमुख शब्दावली','कारण और परिणाम के बीच संबंध','अवधारणा का दैनिक जीवन में अनुप्रयोग','परीक्षा में पूछे जाने वाले मुख्य बिंदु'];return Array.from({length:20},(_,i)=>({id:current().id+'-'+chapterIndex+'-'+i,question:chap()+' : '+facts[i%8]+' को समझने के लिए सबसे उपयुक्त तरीका क्या है? (Demo question '+(i+1)+')',options:['परिभाषा, सिद्धांत और उदाहरण को जोड़कर समझना','बिना समझे केवल शब्द याद करना','प्रश्न को छोड़ देना','सभी विकल्पों को समान मानना'],answer:0,explanation:'यह अभ्यास हेतु बनाया गया demo प्रश्न है। सही अध्ययन में अवधारणा, सिद्धांत और उदाहरण का संबंध समझना आवश्यक है।'}))}
function startQuiz(md){if(timer){clearInterval(timer);timer=null}mode=md;page=md==='test'?'tests':'practice';quiz=makeQuestions();qi=0;selected=null;answered=false;score=0;seconds=md==='test'?1800:0;testAnswers={};testMarked=[];testSubmitted=false;if(md==='test')timer=setInterval(()=>{if(!testSubmitted){seconds--;if(seconds<=0){seconds=0;submitTest(true)}else if(page==='tests')render()}},1000);render();window.scrollTo(0,0)}
function quizPage(){if(mode==='test')return testPage();if(!quiz.length)quiz=makeQuestions();if(qi>=quiz.length)return '<div class="panel"><h1>Test complete 🎉</h1><h2>'+score+' / '+quiz.length+'</h2><p>आपका result इस device पर save कर दिया गया है।</p><button class="solid" onclick="go(\'results\')">View results</button></div>';let q=quiz[qi];return '<div class="welcome"><div><h1>'+(mode==='test'?'Mock test':'Practice zone')+'</h1><div class="muted">'+current().name+' • '+chap()+'</div></div><span class="chip">'+(qi+1)+' / '+quiz.length+'</span></div><div class="question"><div class="muted" style="font-size:12px">DEMO QUESTION • '+(mode==='test'?'Exam mode':'Practice mode')+'</div><h3>'+q.question+'</h3>'+q.options.map((o,i)=>'<button class="option '+(answered&&i===q.answer?'correct':answered&&i===selected?'wrong':'')+'" '+(answered?'disabled':'')+' onclick="answer('+i+')">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+(answered?'<div class="feedback"><b>'+(selected===q.answer?'✅ Correct!':'❌ Not quite')+'</b><p>'+q.explanation+'</p></div>':'')+'<div class="btnrow">'+(answered?'<button class="solid" onclick="nextQ()">Next question →</button>':'<button class="outline" onclick="bookmarkQuestion()">🔖 Bookmark</button>')+'</div></div><div class="muted">Practice questions are illustrative demos, not official UP Board questions.</div>'}
function testPage(){if(!quiz.length)return '<div class="panel"><h2>Mock test complete</h2><p>Your result has been saved.</p><button class="solid" onclick="go(\'results\')">View results</button></div>';if(testSubmitted){let attempted=Object.keys(testAnswers).length,correct=quiz.reduce((n,q,i)=>n+(testAnswers[i]===q.answer?1:0),0);return '<div class="panel"><h1>Mock test submitted 🎉</h1><h2>'+correct+' / '+quiz.length+'</h2><p class="muted">Attempted: '+attempted+' • Unattempted: '+(quiz.length-attempted)+' • Accuracy: '+Math.round(correct/quiz.length*100)+'%</p><button class="solid" onclick="go(\'results\')">View results</button> <button class="outline" onclick="go(\'home\')">Home</button></div>'}let q=quiz[qi],v=testAnswers[qi];return '<div class="welcome"><div><h1>Timed Mock Test ⏱️</h1><div class="muted">'+current().name+' • '+chap()+'</div></div><span class="chip">Question '+(qi+1)+' / '+quiz.length+'</span></div><div class="testbar"><div><div class="muted" style="font-size:11px">TIME REMAINING</div><div class="clock">'+String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')+'</div></div><button class="solid" onclick="submitTest(false)">Submit test</button></div><div class="panel"><div class="testhelp"><span class="answered">Answered</span><span>Not answered</span><span class="marked">Review</span></div><div class="palette">'+quiz.map((_,i)=>'<button class="palbtn '+(i===qi?'current ':'')+(testAnswers[i]!==undefined?'done ':'')+(testMarked.includes(i)?'review':'')+'" onclick="jumpTest('+i+')">'+(i+1)+'</button>').join('')+'</div></div><div class="question"><div class="muted" style="font-size:12px">QUESTION '+(qi+1)+'</div><h3>'+q.question+'</h3>'+q.options.map((o,i)=>'<button class="option '+(v===i?'correct':'')+'" onclick="chooseTest('+i+')">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+'<div class="btnrow"><button class="outline" onclick="toggleMark()">⚑ '+(testMarked.includes(qi)?'Unmark review':'Mark for review')+'</button><button class="outline" onclick="clearTestAnswer()">Clear response</button><button class="solid" onclick="jumpTest(Math.min(qi+1,quiz.length-1))">'+(qi===quiz.length-1?'Last question':'Next →')+'</button></div></div><p class="muted">Demo mock test: questions are illustrative, not official board questions.</p>'}
function chooseTest(i){if(testSubmitted)return;testAnswers[qi]=i;render()}
function jumpTest(i){qi=i;render()}
function toggleMark(){testMarked=testMarked.includes(qi)?testMarked.filter(x=>x!==qi):[...testMarked,qi];render()}
function clearTestAnswer(){delete testAnswers[qi];render()}
function submitTest(auto){if(testSubmitted)return;if(!auto&&!confirm('Submit your mock test now?'))return;testSubmitted=true;if(timer){clearInterval(timer);timer=null}let correct=quiz.reduce((n,q,i)=>n+(testAnswers[i]===q.answer?1:0),0);let a=get('scores',[]);a.unshift({date:new Date().toLocaleDateString('en-IN'),score:correct,total:quiz.length,mode:'mock test',attempted:Object.keys(testAnswers).length});put('scores',a.slice(0,50));render()}
function answer(i){if(answered)return;selected=i;answered=true;if(i===quiz[qi].answer)score++;else{let w=get('wrong',[]);w.unshift({subject:current().name,chapter:chap(),question:quiz[qi].question,explanation:quiz[qi].explanation});put('wrong',w.slice(0,100))}let d=get('done',[]);d.push(quiz[qi].id);put('done',d);render()}
function nextQ(){qi++;selected=null;answered=false;if(qi>=quiz.length){let a=get('scores',[]);a.unshift({date:new Date().toLocaleDateString('en-IN'),score,total:quiz.length,mode});put('scores',a.slice(0,50));quiz=[]}render()}
function bookmarkQuestion(){let s=get('saved',[]);s.unshift({subject:current().name,chapter:chap(),question:quiz[qi].question});put('saved',s);alert('Question bookmarked!')}
function saveChapter(){let s=get('saved',[]);s.unshift({subject:current().name,chapter:chap(),question:'Chapter: '+chap()});put('saved',s);alert('Chapter saved!')}
function pyqPage(){return '<h1>Previous Year Questions 📄</h1><p class="muted">Authentic PYQs will be published only after source/year verification.</p><div class="empty"><div style="font-size:35px">📚</div><h3>Verified PYQ library is being prepared</h3><p>No generated demo question is labelled as a previous-year question.</p></div>'}
function notesPage(){return '<h1>Notes & PDFs 📝</h1><p class="muted">Chapter-wise study material library.</p><div class="empty"><div style="font-size:35px">📖</div><h3>Verified notes are being added</h3><p>Handwritten PDFs and diagrams will appear here after upload and review.</p></div>'}
function itemsPage(k,title,emoji){let a=get(k,[]);return '<h1>'+emoji+' '+title+'</h1><p class="muted">Saved on this device</p>'+(a.length?'<div class="list">'+a.map(x=>'<div class="chapter"><div><b>'+esc(x.subject||'')+' • '+esc(x.chapter||'')+'</b><p class="muted">'+esc(x.question||'')+'</p></div></div>').join('')+'</div>':'<div class="empty">अभी कोई item नहीं है। Practice करते समय questions bookmark करें या गलत उत्तरों को यहाँ revise करें।</div>')}
function resultsPage(){let a=get('scores',[]);return '<h1>My performance 📊</h1><p class="muted">Your recent practice and mock test scores.</p>'+(a.length?'<div class="list">'+a.map(x=>'<div class="chapter"><div><b>'+x.mode+' • '+x.date+'</b><div class="muted">'+x.score+' / '+x.total+' correct</div></div><b>'+Math.round(x.score/x.total*100)+'%</b></div>').join('')+'</div>':'<div class="empty">अभी कोई test result नहीं है। एक practice session शुरू करें!</div>')}
function profilePage(){return '<h1>My Profile 👤</h1><div class="panel"><div class="avatar">N</div><h2>NG Learner</h2><p class="muted">Your progress is stored locally on this device.</p><label>Display name</label><input class="search" id="pname" value="'+esc(get('name','Student'))+'"><button class="solid" onclick="put(\'name\',document.getElementById(\'pname\').value);alert(\'Profile saved\')">Save profile</button></div><p class="muted">No account or paid API required. Clearing browser data may erase local progress.</p>'}
function searchPage(){let term=searchTerm.toLowerCase();let matches=[];subjects.forEach(s=>s.chapters.forEach((c,i)=>{if((c+' '+s.name).toLowerCase().includes(term))matches.push({s,i,c})}));return '<h1>Search 🔎</h1><input class="search" placeholder="Search subject or chapter..." value="'+esc(searchTerm)+'" oninput="searchTerm=this.value;document.getElementById(\'searchResults\').innerHTML=searchMatches()"><div id="searchResults">'+searchMatches()+'</div>'}
function searchMatches(){let t=searchTerm.toLowerCase();let a=[];subjects.forEach(s=>s.chapters.forEach((c,i)=>{if((c+' '+s.name).toLowerCase().includes(t))a.push({s,i,c})}));return '<div class="list">'+a.map(x=>'<div class="chapter"><b>'+x.s.name+' • '+x.c+'</b><button onclick="subjectId=\''+x.s.id+'\';openChapter('+x.i+')">Open</button></div>').join('')+'</div>'}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();searchTerm='';go('search')}});
render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
